    <!-- 2. GOOGLE SEARCH CONSOLE VERIFICATION      -->
    <!-- ========================================== -->
    <!-- PASTE TAG HTML DARI GOOGLE SEARCH CONSOLE DI SINI -->
    <!-- Contoh: <meta name="google-site-verification" content="Q8x9Q6Fg2r3WFLrEEInDDiTQQJ41LOJVR..." /> -->
    <meta name="google-site-verification" content="MASUKKAN_KODE_VERIFIKASI_ANDA_DI_SINI" />


    <!-- ========================================== -->
    <!-- 3. GOOGLE ADS / ANALYTICS TRACKING SCRIPT  -->
    <!-- ========================================== -->
    <!-- PASTE SCRIPT GTAG DARI GOOGLE ADS DI SINI -->
    <!-- Contoh script di bawah ini, ganti AW-XXXXXX dengan ID Anda jika sudah punya -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-XXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Ganti dengan ID Asli Anda
      gtag('config', 'AW-XXXXXXXXX'); 
    </script>
